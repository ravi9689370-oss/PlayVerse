<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2a6a"/>
      <stop offset="1" stop-color="#0c1430"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="330" cy="52" r="70" fill="#93c5fd" opacity="0.12"/>
  <circle cx="52" cy="250" r="52" fill="#93c5fd" opacity="0.10"/>
  <circle cx="352" cy="248" r="24" fill="#93c5fd" opacity="0.22"/>
  <circle cx="40" cy="48" r="10" fill="#ffffff" opacity="0.18"/>
  <circle cx="120" cy="90" r="5" fill="#ffffff" opacity="0.25"/>
  <circle cx="300" cy="150" r="7" fill="#ffffff" opacity="0.2"/>
    <g filter="url(#glow)" opacity="0.9">
      <rect x="152" y="102" width="96" height="96" rx="16" fill="none" stroke="#93c5fd" stroke-width="4"/>
      <rect x="170" y="120" width="60" height="60" rx="10" fill="#93c5fd" opacity="0.4"/>
